<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balamod TSR Admin Panel</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; margin: 0; }
        #login-screen { max-width: 350px; margin: 80px auto; background: #161b22; padding: 25px; border-radius: 8px; border: 1px solid #30363d; text-align: center; }
        #login-screen input { width: 100%; padding: 10px; margin: 15px 0; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #fff; box-sizing: border-box; }
        #login-screen button { width: 100%; background: #238636; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #dashboard { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-card h3 { margin: 0; color: #58a6ff; font-size: 22px; }
        .stat-card p { margin: 5px 0 0 0; color: #8b949e; font-size: 13px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: #21262d; color: white; border: 1px solid #30363d; padding: 10px 18px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .tab-btn.active { background: #1f6beb; border-color: #1f6beb; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; background: #161b22; }
        th, td { border: 1px solid #30363d; padding: 12px; text-align: left; }
        th { background: #21262d; color: #58a6ff; }
        .approve-btn { background: #238636; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        textarea { width: 100%; height: 260px; background: #0f172a; color: #38bdf8; font-family: monospace; padding: 12px; border: 1px solid #30363d; border-radius: 6px; box-sizing: border-box; }
        .input-box { width: 100%; padding: 10px; margin: 8px 0 15px 0; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #00d2ff; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="login-screen">
    <h3>Balamod Admin Login</h3>
    <input type="password" id="admin-pass" placeholder="पासवर्ड दर्ज़ करें (TSR1234)">
    <button onclick="login()">लॉगिन करें</button>
</div>

<div id="dashboard">
    <h2>Balamod Ultimate Admin Panel</h2>

    <div class="stats-grid">
        <div class="stat-card"><h3 id="stat-revenue">₹0</h3><p>Total Revenue</p></div>
        <div class="stat-card"><h3 id="stat-pending">0</h3><p>Pending Orders</p></div>
        <div class="stat-card"><h3 id="stat-approved">0</h3><p>Approved Keys</p></div>
        <div class="stat-card"><h3 id="stat-total">0</h3><p>Total Requests</p></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('requests')">Orders & Keys</button>
        <button class="tab-btn" onclick="showTab('code-editor')">💻 Script Editor</button>
        <button class="tab-btn" onclick="showTab('api-settings')">🌐 API Manager</button>
    </div>

    <!-- Tab 1: Orders -->
    <div id="requests" class="tab-content active">
        <button style="background:#238636; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; margin-bottom:10px;" onclick="fetchRequests()">रिफ्रेश लिस्ट</button>
        <table>
            <thead>
                <tr>
                    <th>Req ID</th>
                    <th>Plan</th>
                    <th>Amount</th>
                    <th>UTR</th>
                    <th>Status</th>
                    <th>Key</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <!-- Tab 2: Script Code Editor -->
    <div id="code-editor" class="tab-content">
        <h3>Custom Script / Injector Source Code</h3>
        <textarea id="custom-code-input"></textarea>
        <br><br>
        <button style="background:#1f6beb; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:bold;" onclick="saveCustomCode()">कोड सेव करें</button>
    </div>

    <!-- Tab 3: API Settings -->
    <div id="api-settings" class="tab-content">
        <h3>Active API Config (एक्सटर्नल API कनेक्ट करें)</h3>
        <label>API Endpoint URL:</label>
        <input type="text" id="api-url" class="input-box">

        <label>API Key / Token:</label>
        <input type="text" id="api-key" class="input-box">

        <label style="cursor: pointer;">
            <input type="checkbox" id="api-enabled"> Enable External API Integration
        </label>
        <br><br>
        <button style="background:#1f6beb; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:bold;" onclick="saveApiConfig()">API सेटिंग्स सेव करें</button>
    </div>
</div>

<script>
let savedPassword = localStorage.getItem('adminPass') || '';

if (savedPassword) verifyAndLoad(savedPassword);

async function login() {
    const pass = document.getElementById('admin-pass').value;
    verifyAndLoad(pass);
}

async function verifyAndLoad(pass) {
    const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
    });
    const data = await res.json();

    if (data.status) {
        localStorage.setItem('adminPass', pass);
        savedPassword = pass;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        fetchRequests();
        loadCustomCode();
        loadApiConfig();
    } else {
        alert(data.message);
    }
}

function showTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
}

async function fetchRequests() {
    const res = await fetch('/api/admin/pending-requests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: savedPassword })
    });
    const data = await res.json();
    if (!data.requests) return;

    document.getElementById('stat-revenue').innerText = "₹" + data.stats.revenue;
    document.getElementById('stat-pending').innerText = data.stats.pending;
    document.getElementById('stat-approved').innerText = data.stats.approved;
    document.getElementById('stat-total').innerText = data.stats.totalRequests;

    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';
    data.requests.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td>${item.id}</td>
                <td>${item.plan}</td>
                <td>₹${item.amount}</td>
                <td><b style="color:#58a6ff">${item.utr}</b></td>
                <td>${item.status}</td>
                <td>${item.key || 'N/A'}</td>
                <td>
                    ${item.status === 'PENDING' ? 
                    `<button class="approve-btn" onclick="approve('${item.id}')">Approve Key</button>` : 
                    `<span style="color:#2ea043">${item.status}</span>`}
                </td>
            </tr>`;
    });
}

async function approve(req_id) {
    const res = await fetch('/api/admin/approve-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ req_id, password: savedPassword })
    });
    const data = await res.json();
    if (data.status) { alert("Key Generated: " + data.key); fetchRequests(); }
}

async function saveCustomCode() {
    const code = document.getElementById('custom-code-input').value;
    const res = await fetch('/api/admin/save-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: savedPassword, code })
    });
    const data = await res.json();
    alert(data.message);
}

async function loadCustomCode() {
    const res = await fetch('/api/admin/get-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: savedPassword })
    });
    const data = await res.json();
    if (data.status) document.getElementById('custom-code-input').value = data.code;
}

async function saveApiConfig() {
    const apiUrl = document.getElementById('api-url').value;
    const apiKey = document.getElementById('api-key').value;
    const enabled = document.getElementById('api-enabled').checked;

    const res = await fetch('/api/admin/save-api-config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: savedPassword, apiUrl, apiKey, enabled })
    });
    const data = await res.json();
    alert(data.message);
}

async function loadApiConfig() {
    const res = await fetch('/api/admin/get-api-config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: savedPassword })
    });
    const data = await res.json();
    if (data.status && data.config) {
        document.getElementById('api-url').value = data.config.apiUrl || '';
        document.getElementById('api-key').value = data.config.apiKey || '';
        document.getElementById('api-enabled').checked = data.config.enabled || false;
    }
}
</script>

</body>
  </html>
