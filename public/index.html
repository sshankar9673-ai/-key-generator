<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balamod TSR Key Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0e17; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .box { background: #161f30; padding: 25px; border-radius: 12px; width: 100%; max-width: 420px; border: 1px solid #23344e; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { color: #00d2ff; text-align: center; margin-bottom: 15px; }
        label { font-size: 14px; color: #94a3b8; display: block; margin-top: 10px; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0 12px 0; border-radius: 6px; border: 1px solid #2a3c5a; background: #0f172a; color: #fff; font-size: 15px; }
        .payment-box { background: #0f172a; border: 1px dashed #38bdf8; border-radius: 8px; padding: 15px; text-align: center; margin: 15px 0; }
        .qr-img { width: 180px; height: 180px; border-radius: 8px; background: #fff; padding: 5px; margin: 10px 0; }
        .upi-id { background: #1e293b; color: #00d2ff; padding: 8px; border-radius: 4px; font-weight: bold; font-size: 16px; display: inline-block; margin-top: 5px; }
        button { background: #00d2ff; color: #000; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { background: #00a8cc; }
        .status-box { margin-top: 15px; border-top: 1px solid #23344e; padding-top: 15px; }
        .key-display { font-size: 15px; color: #00ff88; font-weight: bold; word-break: break-all; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="box">
    <h2>BALAMOD TSR STORE</h2>
    
    <label>1. प्लान चुनें:</label>
    <select id="plan" onchange="updateAmount()">
        <option value="1h" data-price="10">1 घंटा - ₹10</option>
        <option value="5h" data-price="35">5 घंटा - ₹35</option>
        <option value="24h" data-price="90">24 घंटा - ₹90</option>
        <option value="2d" data-price="120">2 दिन - ₹120</option>
        <option value="30d" data-price="320">30 दिन - ₹320</option>
    </select>

    <div class="payment-box">
        <p style="color: #94a3b8; font-size: 14px;">Paytm / PhonePe / GPay QR Code</p>
        <img id="qr-code" class="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=balamod@paytm%26pn=BalamodStore%26am=10" alt="QR Code">
        <p style="font-size: 13px; color: #cbd5e1;">राशि: <b id="pay-amount" style="color: #22c55e; font-size: 16px;">₹10</b></p>
        <div class="upi-id">balamod@paytm</div>
    </div>

    <label>2. Paytm UTR नंबर डालें:</label>
    <input type="text" id="utr" placeholder="12-Digit UTR Number" required>
    <input type="text" id="contact" placeholder="Mobile / WhatsApp (Optional)">
    <button onclick="submitOrder()">पेमेंट सबमिट करें</button>

    <div class="status-box">
        <h3 style="margin-top:0; font-size: 15px; color: #94a3b8;">3. अपनी Key निकालें</h3>
        <input type="text" id="search-query" placeholder="अपना UTR दर्ज करें">
        <button style="background: #334155; color: white;" onclick="checkKey()">Key चेक करें</button>
        <div id="result" class="key-display"></div>
    </div>
</div>

<script>
function updateAmount() {
    const planSelect = document.getElementById('plan');
    const selectedOption = planSelect.options[planSelect.selectedIndex];
    const amount = selectedOption.getAttribute('data-price');
    const upiId = "balamod@paytm"; 
    document.getElementById('pay-amount').innerText = `₹${amount}`;
    document.getElementById('qr-code').src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=${upiId}%26pn=BalamodStore%26am=${amount}`;
}

async function submitOrder() {
    const plan = document.getElementById('plan').value;
    const utr = document.getElementById('utr').value;
    const contact = document.getElementById('contact').value;

    if (!utr) return alert("कृपया UTR नंबर दर्ज करें!");

    const res = await fetch('/api/request-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan, utr, contact })
    });
    const data = await res.json();
    alert(data.message);
}

async function checkKey() {
    const query = document.getElementById('search-query').value;
    if (!query) return alert("UTR दर्ज करें");

    const res = await fetch(`/api/verify-key?query=${query}`);
    const data = await res.json();
    const resDiv = document.getElementById('result');

    if (data.status) {
        if (data.request_status === 'APPROVED') {
            resDiv.innerHTML = `आपकी Key:<br><span style="color:#00d2ff; font-size:18px;">${data.key}</span><br><small style="color:#aaa;">Expiry: ${data.expiresAt}</small>`;
        } else {
            resDiv.innerHTML = `<span style="color:yellow">स्टेटस: PENDING (एडमिन वेरिफिकेशन जारी है)</span>`;
        }
    } else {
        resDiv.innerHTML = `<span style="color:red">${data.message}</span>`;
    }
}
</script>

</body>
</html>
